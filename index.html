          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error(error);
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {
          console.error(error);
        }
      }, [key, storedValue]);

      return [storedValue, setStoredValue];
    }

    // ==========================================

      const [newTaskPriority, setNewTaskPriority] = useState('High');

        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const entry = {
          id: 't-' + Date.now(),
          title: newTaskTitle.trim(),
          subject: newTaskSubj,
          priority: newTaskPriority,
          completed: false,
          date: new Date().toISOString().split('T')[0]
        };
        setTasks([entry, ...tasks]);
        setNewTaskTitle('');
        triggerToast('Task added instantly!');

      const toggleTask = (id) => {
        const updated = tasks.map(t => {
          if (t.id === id) {
            const nextState = !t.completed;
            if (nextState) triggerConfetti();
            return { ...t, completed: nextState };
          }
          return t;
        });
        setTasks(updated);
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));

                <div className="bg-slate-900/90 p-2.5 rounded-xl border border-indigo-500/30 text-center">

            </div>

                            <span className={`px-2 py-0.5 rounded font-bold ${
                              t.priority === 'High' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'
                            }`}>{t.priority}</span>
                          </div>

                      <button onClick={() => deleteTask(t.id)} className="p-1.5 text-slate-500 hover:text-rose-400">

              />

    // ==========================================
    // 2. MATH HIGHER TIER TRAFFIC LIGHT SYSTEM
    // ==========================================
    function MathView({ mathTrafficLights, setMathTrafficLights, triggerToast }) {
      // Calculate overall mastery percentage
      const totalTopics = useMemo(() => {
        let count = 0;
        MATH_HIGHER_TOPICS.forEach(cat => count += cat.items.length);
        return count;
      }, []);

      const greenCount = useMemo(() => {
        return Object.values(mathTrafficLights).filter(val => val === 'green').length;
      }, [mathTrafficLights]);

      const masteryPct = Math.round((greenCount / totalTopics) * 100);

      const setTrafficLight = (item, color) => {
        setMathTrafficLights({
          ...mathTrafficLights,
          [item]: color
        });
        triggerToast(`Updated topic confidence for: ${item}`);
      };

      return (
        <div className="space-y-6">
          {/* HEADER BANNER */}
          <div className="glass-card rounded-2xl p-6 border border-indigo-500/30 space-y-4">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-indigo-400">Mathematics A Higher Tier (1HR & 2HR)</span>
                <h2 className="text-2xl font-black text-white">Traffic Light Mastery System</h2>
                <p className="text-xs text-slate-300">Click Red (Weak), Yellow (Medium), or Green (Mastered) for every syllabus topic.</p>
              </div>

              {/* Live Mastery Meter */}
              <div className="bg-slate-900 p-4 rounded-xl border border-indigo-500/40 text-right min-w-[160px]">
                <span className="block text-[10px] font-bold uppercase text-slate-400">Mastery Progress</span>
                <span className="text-2xl font-black text-emerald-400">{masteryPct}% Mastered</span>
                <span className="block text-[10px] text-slate-400">{greenCount} of {totalTopics} Topics Green</span>
              </div>
            </div>

            <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
              <div className="bg-emerald-500 h-3 rounded-full transition-all duration-500" style={{ width: `${masteryPct}%` }}></div>
            </div>
          </div>

          {/* TOPIC MODULES GRID */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {MATH_HIGHER_TOPICS.map((cat, idx) => (
              <div key={idx} className="glass-card rounded-xl p-5 border border-slate-800 space-y-3">
                <h3 className="text-sm font-bold text-indigo-300 uppercase tracking-wider border-b border-slate-800 pb-2">
                  {cat.category}
                </h3>

                <div className="space-y-2.5">
                  {cat.items.map((item) => {
                    const currentTL = mathTrafficLights[item] || 'red';
                    return (
                      <div key={item} className="p-3 bg-slate-900/90 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <span className="font-semibold text-slate-200 flex-1 pr-2">{item}</span>

                        {/* Traffic Light Buttons */}
                        <div className="flex gap-1.5">
                          <button 
                            onClick={() => setTrafficLight(item, 'red')}
                            className={`w-7 h-7 rounded-lg font-black transition ${
                              currentTL === 'red' ? 'bg-rose-600 text-white shadow-md shadow-rose-600/40 scale-105' : 'bg-slate-800 text-rose-500 hover:bg-slate-700'
                            }`}
                          >
                            R
                          </button>
                          <button 
                            onClick={() => setTrafficLight(item, 'yellow')}
                            className={`w-7 h-7 rounded-lg font-black transition ${
                              currentTL === 'yellow' ? 'bg-amber-500 text-white shadow-md shadow-amber-500/40 scale-105' : 'bg-slate-800 text-amber-500 hover:bg-slate-700'
                            }`}
                          >
                            Y
                          </button>
                          <button 
                            onClick={() => setTrafficLight(item, 'green')}
                            className={`w-7 h-7 rounded-lg font-black transition ${
                              currentTL === 'green' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/40 scale-105' : 'bg-slate-800 text-emerald-500 hover:bg-slate-700'
                            }`}
                          >
                            G
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

              {holidays.map(h => (
                <div key={h.id} className={`p-4 rounded-xl border flex justify-between items-center ${h.color}`}>
                  <div>
                    <span className="text-xs font-bold uppercase">{h.category}</span>
                    <h4 className="text-sm font-bold">{h.title}</h4>
                    <p className="text-xs opacity-80">{h.start} to {h.end}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
